name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify + coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Rootless Docker daemon for Testcontainers (OrbStack-equivalent on CI).
      - uses: docker/setup-docker-action@v4
      - name: Verify (JUnit 5 + AssertJ + Testcontainers + JaCoCo check)
        working-directory: backend
        run: ./mvnw verify --no-transfer-progress