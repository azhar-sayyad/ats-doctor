<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Candidate Resume</title>
    <style th:inline="text">
        [(${template_css})]
    </style>
</head>
<body>
    <h1 th:text="${title}">Candidate Name</h1>
    <div class="contact" th:if="${basics} != null">
        <span th:if="${basics.email} != null and !${basics.email.isEmpty()}" th:text="${basics.email}">email@example.com</span>
        <span th:if="${basics.phone} != null and !${basics.phone.isEmpty()}" th:text="' | ' + ${basics.phone}">+123456789</span>
        <span th:if="${basics.location} != null and !${basics.location.isEmpty()}" th:text="' | ' + ${basics.location}">Location</span>
        <span th:if="${basics.linkedin} != null and !${basics.linkedin.isEmpty()}" th:text="' | ' + ${basics.linkedin}">LinkedIn</span>
        <span th:if="${basics.github} != null and !${basics.github.isEmpty()}" th:text="' | ' + ${basics.github}">GitHub</span>
    </div>

    <div class="meta" th:text="'Generated by ATS Doctor on ' + ${generated_at}">
        Generated by ATS Doctor
    </div>

    <div th:if="${summary} != null">
        <h2>Professional Summary</h2>
        <p th:text="${summary}">Candidate summary text goes here.</p>
    </div>

    <div th:if="${skills} != null and !${skills.isEmpty()}">
        <h2>Technical Skills</h2>
        <div>
            <span class="skill-badge" th:each="skill : ${skills}" th:text="${skill.name}">Skill</span>
        </div>
    </div>

    <div th:if="${sections} != null and !${sections.isEmpty()}">
        <h2>Work Experience</h2>
        <div th:each="section : ${sections}">
            <div class="heading" th:text="${section.heading}">Company - Title</div>
            <ul>
                <li th:each="bullet : ${section.bullets}" th:text="${bullet}">Bullet</li>
            </ul>
        </div>
    </div>

    <div th:if="${projects} != null and !${projects.isEmpty()}">
        <h2>Projects</h2>
        <div th:each="project : ${projects}">
            <div class="heading" th:text="${project.name}">Project Name</div>
            <p th:text="${project.description}">Project description</p>
        </div>
    </div>

    <div th:if="${education} != null and !${education.isEmpty()}">
        <h2>Education</h2>
        <div th:each="edu : ${education}">
            <div class="heading" th:text="${edu.institution}">University</div>
            <p th:text="${edu.degree} + ' - ' + ${edu.field}">Degree</p>
        </div>
    </div>
</body>
</html>
