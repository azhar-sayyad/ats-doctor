<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Tailored Resume</title>
</head>
<body>
    <h1 th:text="${title}">Tailored Resume</h1>
    <p class="meta" th:text="'Generated by ATS Doctor on ' + ${generated_at}">
        Generated by ATS Doctor
    </p>
    <h2 th:if="${summary} != null" th:text="${summary}">Summary</h2>
    <div th:each="section : ${sections}">
        <h2 th:text="${section.heading}">Experience</h2>
        <ul>
            <li th:each="bullet : ${section.bullets}" th:text="${bullet}">Bullet</li>
        </ul>
    </div>
</body>
</html>
